<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduGuide AI</title>

<link rel="stylesheet" href="style.css">

<style>

body{
background:#f5f7ff;
font-family:Poppins,sans-serif;
}

.chat-container{

width:90%;
max-width:700px;
margin:40px auto;
background:white;
border-radius:15px;
box-shadow:0 0 20px rgba(0,0,0,.2);

}

.chat-header{

background:linear-gradient(90deg,#7b2ff7,#4facfe);
color:white;
padding:20px;
font-size:22px;
font-weight:bold;
border-radius:15px 15px 0 0;

}

.chat-box{

height:400px;
overflow-y:auto;
padding:15px;

}

.bot{

background:#ecebff;
padding:12px;
border-radius:10px;
margin-bottom:15px;

}

.user{

background:#d9fdd3;
padding:12px;
border-radius:10px;
margin-bottom:15px;
text-align:right;

}

.input-area{

display:flex;
padding:15px;
gap:10px;

}

input{

flex:1;
padding:12px;
border-radius:8px;
border:1px solid #ccc;

}

button{

padding:12px 20px;
background:#7b2ff7;
color:white;
border:none;
border-radius:8px;
cursor:pointer;

}

</style>

</head>

<body>

<div class="chat-container">

<div class="chat-header">

🤖 EduGuide AI

</div>

<div class="chat-box" id="chatBox">

<div class="bot">

👋 Hello! I'm EduGuide AI.

Ask me anything about courses, colleges or careers.

</div>

</div>

<div class="input-area">

<input type="text"
id="userInput"
placeholder="Ask your question...">

<button onclick="sendMessage()">

Send

</button>

</div>

</div>

<script src="script.js"></script>

</body>

</html>
